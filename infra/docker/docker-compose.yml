services:
  mongodb:
    image: mongo:7
    container_name: queryproof-mongo
    ports:
      - "27017:27017"
    volumes:
      - queryproof_mongo:/data/db
    
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    container_name: queryproof-elasticsearch
    ports:
      - "9200:9200"
    volumes:
      - queryproof_elasticsearch:/usr/share/elasticsearch/data
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9200"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    
  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.3
    container_name: queryproof-kibana
    ports:
      - "5601:5601"
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    depends_on:
      - elasticsearch

volumes:
  queryproof_mongo:
  queryproof_elasticsearch:
